<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckMod</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171c25; --panel2: #1e2531; --line: #2a3342;
    --text: #e6eaf2; --muted: #8b96a8; --accent: #1a9fff; --ok: #3fcf8e; --warn: #f5b53f; --bad: #ff5c6c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; cursor: pointer; min-height: 44px; }
  button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
  input[type=text], input[type=search] { background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 44px; }
  input:focus { border-color: var(--accent); outline: none; }
  .app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; justify-content: space-between; }
  .brand h1 { margin: 0; font-size: 22px; } .brand h1 span { color: var(--accent); }
  #gameList { overflow-y: auto; flex: 1; padding: 8px; }
  .game { display: block; width: 100%; text-align: left; margin-bottom: 4px; background: transparent; border-color: transparent; }
  .game.active { background: var(--panel2); border-color: var(--accent); }
  .game small { display: block; color: var(--muted); font-size: 12px; }
  main { overflow-y: auto; padding: 24px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); } .mono { font-family: ui-monospace, monospace; font-size: 13px; word-break: break-all; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; border: 1px solid var(--line); }
  .pill.ok { color: var(--ok); border-color: var(--ok); } .pill.off { color: var(--warn); border-color: var(--warn); }
  .launch { background: #2a2210; border: 1px solid var(--warn); border-radius: 10px; padding: 12px; margin-top: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  td.n { width: 36px; color: var(--muted); text-align: right; }
  .modname { font-weight: 600; } .badge { color: var(--warn); font-size: 12px; margin-left: 6px; }
  .toggle { width: 60px; } .toggle.on { background: var(--ok); border-color: var(--ok); color: #062; font-weight: 700; }
  .actions { white-space: nowrap; text-align: right; }
  .dl { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--accent); border-radius: 12px; padding: 12px 18px; display: none; max-width: 90vw; z-index: 9; white-space: pre-wrap; }
  #toast.err { border-color: var(--bad); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
    main { padding: 16px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <div class="brand"><h1>Deck<span>Mod</span></h1>
        <button class="small" id="refresh" title="Rescan installed games">Rescan</button></div>
      <input type="search" id="search" placeholder="Search games…">
    </header>
    <div id="gameList"></div>
  </aside>
  <main id="main"><div class="empty">Pick a game on the left to manage its mods.</div></main>
</div>
<div id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
let games = [], current = null, info = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, err=false) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", err ? 8000 : 4000);
}
async function api(path, body, raw) {
  const opts = body === undefined ? {} : { method: "POST", headers: {"X-DeckMod-Token": TOKEN},
    body: raw ? body : JSON.stringify(body) };
  const r = await fetch(path, opts); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function loadGames(refresh) {
  games = await api("/api/games" + (refresh ? "?refresh=1" : ""));
  renderGames();
}
function renderGames() {
  const q = $("#search").value.toLowerCase();
  const list = games.filter(g => g.name.toLowerCase().includes(q));
  $("#gameList").innerHTML = list.length ? list.map(g =>
    `<button class="game ${g.id === current ? "active" : ""}" data-id="${esc(g.id)}">${esc(g.name)}
       <small>${esc(g.source)}${g.prefix ? " · Proton/Wine" : ""}</small></button>`).join("")
    : `<p class="muted" style="padding:12px">No games found.</p>`;
}
$("#gameList").addEventListener("click", e => { const b = e.target.closest(".game"); if (b) openGame(b.dataset.id); });
$("#search").addEventListener("input", renderGames);
$("#refresh").onclick = () => loadGames(true).then(() => toast("Games rescanned"));

async function openGame(id) {
  current = id; renderGames();
  try { info = await api("/api/game?id=" + encodeURIComponent(id)); renderGame(); }
  catch (e) { toast(e.message, true); }
}

function renderGame() {
  const g = info.game, mods = info.mods;
  $("#main").innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><h2 style="margin:0">${esc(g.name)}</h2>
        <div class="muted">${esc(info.engine.name)} · ${esc(g.source)}
          · <span class="pill ${info.deployed ? "ok" : "off"}">${info.deployed ? "Mods active" : "Vanilla"}</span></div></div>
      <div class="row">
        <button class="primary" data-act="deploy">${info.deployed ? "Re-apply mods" : "Apply mods"}</button>
        <button data-act="purge">Restore vanilla</button>
      </div>
    </div>
    <p class="mono muted">${esc(info.root)}</p>
    ${info.launch_options ? `<div class="launch"><b>Launch options needed.</b> This game uses a DLL mod loader;
       Proton ignores it unless you set this in Steam → Properties → Launch Options:
       <div class="row" style="margin-top:8px"><code class="mono" id="lo">${esc(info.launch_options)}</code>
       <button class="small" data-act="copy">Copy</button></div></div>` : ""}
    ${info.engine.notes.map(n => `<p class="muted" style="margin:8px 0 0">ℹ ${esc(n)}</p>`).join("")}
  </div>

  <div class="card">
    <h2>Mods <span class="muted" style="font-weight:400;font-size:14px">— lower in the list wins conflicts</span></h2>
    ${mods.length ? `<table>${mods.map((m, i) => `
      <tr>
        <td class="n">${i + 1}</td>
        <td style="width:70px"><button class="toggle small ${m.enabled ? "on" : ""}" data-act="toggle" data-mod="${esc(m.id)}">${m.enabled ? "ON" : "OFF"}</button></td>
        <td><span class="modname">${esc(m.name)}</span>${m.guessed ? `<span class="badge">⚠ location guessed</span>` : ""}
          <div class="muted mono">→ ${esc(m.target || "(game root)")} · ${m.files} files</div></td>
        <td class="actions">
          <button class="small" data-act="up" data-mod="${esc(m.id)}" ${i === 0 ? "disabled" : ""} title="Move up">▲</button>
          <button class="small" data-act="down" data-mod="${esc(m.id)}" ${i === mods.length - 1 ? "disabled" : ""} title="Move down">▼</button>
          <button class="small" data-act="target" data-mod="${esc(m.id)}" title="Change install folder">Folder</button>
          <button class="small danger" data-act="remove" data-mod="${esc(m.id)}">Remove</button>
        </td>
      </tr>`).join("")}</table>` : `<p class="muted">No mods yet. Add one below.</p>`}
    ${info.conflicts.length ? `<details style="margin-top:12px"><summary>${info.conflicts.length} file conflict(s)</summary>
       ${info.conflicts.slice(0, 200).map(c => `<div class="mono muted">${esc(c.file)} — ${esc(c.winner)} wins over ${esc(c.overridden.join(", "))}</div>`).join("")}
       </details>` : ""}
  </div>

  <div class="card">
    <h2>Add a mod</h2>
    <div class="drop" id="drop">Drop a mod archive here (.zip, .7z, .rar, .pak, .dll…) or
      <label style="color:var(--accent);cursor:pointer"><u>browse</u><input type="file" id="file" hidden multiple></label></div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="src" placeholder="…or paste a file/folder path or a direct download URL" style="flex:3">
      <input type="text" id="tgt" placeholder="Folder (optional, / = game root)" style="flex:1;min-width:140px">
      <button class="primary" data-act="install">Install</button>
    </div>
    <h2 style="margin-top:18px;font-size:15px">Recent downloads</h2>
    <div id="dls" class="muted">Loading…</div>
  </div>`;
  loadDownloads();
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };
  $("#file").onchange = e => upload(e.target.files);
}

async function loadDownloads() {
  try {
    const d = await api("/api/downloads");
    $("#dls").innerHTML = d.length ? d.slice(0, 15).map(f => `<div class="dl"><span class="mono">${esc(f.name)}
      <span class="muted">(${(f.size / 1048576).toFixed(1)} MB)</span></span>
      <button class="small" data-act="install-dl" data-path="${esc(f.path)}">Install</button></div>`).join("")
      : "Nothing in ~/Downloads yet.";
  } catch (e) { $("#dls").textContent = e.message; }
}

function report(res, verb) {
  const d = res.deploy; let msg = verb;
  if (d) {
    msg += ` · ${d.files} mod file(s) active`;
    if (d.conflicts.length) msg += ` · ${d.conflicts.length} conflict(s)`;
  }
  const m = res.mod || res.result;
  if (m && m.guessed) msg += `\n⚠ Couldn't tell where "${m.name}" goes — check its readme and use "Folder" if it doesn't work.`;
  toast(msg);
}

async function upload(files) {
  for (const f of files) {
    toast(`Installing ${f.name}…`);
    try {
      const res = await api(`/api/upload?game=${encodeURIComponent(current)}&filename=${encodeURIComponent(f.name)}`, f, true);
      report(res, `Installed ${res.mod.name}`);
    } catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  openGame(current);
}

async function act(action, body, verb) {
  try { const res = await api("/api/" + action, {game: current, ...body}); report(res, verb); await openGame(current); }
  catch (e) { toast(e.message, true); }
}

$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const mod = b.dataset.mod, m = info && info.mods.find(x => x.id === mod), idx = m ? info.mods.indexOf(m) + 1 : 0;
  switch (b.dataset.act) {
    case "deploy": return act("deploy", {}, "Mods applied");
    case "purge": return act("purge", {}, "Game restored to vanilla");
    case "copy": navigator.clipboard?.writeText($("#lo").textContent).then(() => toast("Copied"), () => toast("Select the text and copy it manually", true)); return;
    case "toggle": return act("enable", {mod, value: !m.enabled}, `${m.enabled ? "Disabled" : "Enabled"} ${m.name}`);
    case "up": return act("move", {mod, value: idx - 1}, "Load order updated");
    case "down": return act("move", {mod, value: idx + 1}, "Load order updated");
    case "remove": if (confirm(`Remove "${m.name}"?`)) act("uninstall", {mod}, `Removed ${m.name}`); return;
    case "target": {
      const v = prompt(`Folder inside the game for "${m.name}" (empty = game root):`, m.target);
      if (v !== null) act("target", {mod, value: v}, "Install folder changed"); return;
    }
    case "install": {
      const tgt = $("#tgt").value.trim();
      return act("install", {source: $("#src").value, target: tgt === "" ? null : tgt}, "Installed");
    }
    case "install-dl": return act("install", {source: b.dataset.path}, "Installed");
  }
});

loadGames().catch(e => toast(e.message, true));
</script>
</body>
</html>
